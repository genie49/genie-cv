[build]
builder = "RAILPACK"
buildCommand = "bun install --frozen-lockfile && cd apps/client && bun run build:docker"
watchPatterns = ["apps/client/**", "packages/shared/**", "data/**", "scripts/**", "bun.lock", ".dockerignore"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
